<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><title>Odeon architecture: A feedback loop for voice agents</title><defs><linearGradient id="wash" x2="0" y2="1"><stop stop-color="#202630"/><stop offset="1" stop-color="#0d0f12"/></linearGradient></defs><rect width="1200" height="675" fill="#0d0f12"/><rect width="1200" height="675" fill="url(#wash)" opacity=".55"/><g font-family="Arial,Helvetica,sans-serif"><text x="58" y="87" font-size="55" fill="#edf1f7" font-weight="600" text-anchor="start">Odeon</text><text x="58" y="235" font-size="35" fill="#edf1f7" font-weight="400" text-anchor="start">Test. Learn.</text><text x="58" y="281" font-size="35" fill="#edf1f7" font-weight="400" text-anchor="start">Run it again.</text><path d="M58 330H126" fill="none" stroke="#b7cce2" stroke-width="4" stroke-linecap="round" /><text x="58" y="389" font-size="23" fill="#aab6c6" font-weight="400" text-anchor="start">Architecture</text><path d="M774 146C998 119 1127 391 920 475C711 559 534 302 689 195" fill="none" stroke="#b7cce2" stroke-width="5" stroke-linecap="round" /><path d="M784 169C956 161 1067 365 900 446C744 513 590 328 700 220" fill="none" stroke="#414f60" stroke-width="1" stroke-linecap="round" /><circle cx="759" cy="153" r="22" fill="#0d0f12" stroke="#b7cce2" stroke-width="4"/><circle cx="1025" cy="321" r="22" fill="#0d0f12" stroke="#b7cce2" stroke-width="4"/><circle cx="792" cy="488" r="22" fill="#0d0f12" stroke="#b7cce2" stroke-width="4"/><text x="706" y="110" font-size="31" fill="#edf1f7" font-weight="600" text-anchor="start">Simulate</text><text x="1060" y="318" font-size="31" fill="#edf1f7" font-weight="600" text-anchor="start">Score</text><text x="792" y="554" font-size="31" fill="#edf1f7" font-weight="600" text-anchor="middle">Revise prompt</text><text x="809" y="300" font-size="44" fill="#edf1f7" font-weight="600" text-anchor="middle">Prompt</text><text x="809" y="342" font-size="29" fill="#aab6c6" font-weight="400" text-anchor