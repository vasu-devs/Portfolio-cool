<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Typography studio · Vasu-Devs</title>
<style>*{box-sizing:border-box}body{margin:0;background:#061924;color:#e3f0f9;font:14px/1.5 system-ui}header{padding:16px 22px;border-bottom:1px solid #3b5260}h1{font-size:18px;margin:0 0 10px}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}button,select{font:inherit;color:inherit;background:#102b3a;border:1px solid #617b8b;border-radius:6px;padding:8px 12px;cursor:pointer}button[aria-pressed=true]{color:#061924;background:#e3f0f9}#note{margin:12px 0;max-width:90ch;color:#b4cedd}.tools{display:flex;flex-wrap:wrap;align-items:center;gap:16px;font-size:12px}.stage{display:flex;justify-content:center;padding:10px}iframe{width:100%;height:calc(100dvh - 225px);min-height:500px;border:0;border-radius:6px}iframe.phone{max-width:390px}button:focus-visible,select:focus-visible{outline:2px solid #9cdeef;outline-offset:3px}</style>
<header><h1>Find the right type</h1><div class="controls" aria-label="Typography directions"><button data-look="original" aria-pressed="false">Current</button><button data-look="editorial" aria-pressed="true">01 · Editorial</button><button data-look="graphic" aria-pressed="false">02 · Graphic</button><button data-look="warm" aria-pressed="false">03 · Personal journal</button><button data-look="modern" aria-pressed="false">04 · Modern</button></div><p id="note" aria-live="polite"></p><div class="tools"><label>Theme <select id="theme"><option value="light">Seireitei</option><option value="dark">Hueco Mundo</option></select></label><label>Width <select id="width"><option value="desktop">Desktop</option><option value="phone">Mobile</option></select></label><label>Preview <select id="section"><option value="top">Hero & intro</option><option value="experience">Experience</option><option value="video">Project walkthroughs</option><option value="contact">Contact</option><option value="modal">Project modal</option></select></label><span>Preview only · live typography unchanged</span></div></header><div class="stage"><iframe title="Full portfolio typography preview" src="/test/?typography-lab=120#home"></iframe></div>
<script>
const frame=document.querySelector('iframe');let look='editorial';
const looks={
 original:{note:'Current typography, for comparison.',css:''},
 editorial:{note:'Bodoni Moda + Manrope. My first pick: expressive serif headings, a gently italic opening, and clean body copy.',css:`--lab-heading:'Studio Bodoni',Georgia,serif;--lab-body:'Studio Manrope',sans-serif;--lab-title-weight:400;--lab-title-spacing:-.035em;--lab-heading-size:34px;--lab-body-size:16px;--lab-leading:1.85; .intro p:first-child{font-family:'Studio Bodoni',Georgia,serif!important;font-style:italic;font-size:28px!important;line-height:1.55!important}`},
 graphic:{note:'Barlow Condensed + Manrope. Stronger, taller headings with a manga-editorial character; restrained body text keeps long sections readable.',css:`--lab-heading:'Studio Barlow',sans-serif;--lab-body:'Studio Manrope',sans-serif;--lab-title-weight:600;--lab-title-spacing:-.01em;--lab-heading-size:38px;--lab-body-size:16px;--lab-leading:1.8; .intro p:first-child{font-family:'Studio Barlow',sans-serif!important;font-size:30px!important;line-height:1.4!important}.eyebrow,.role-date{letter-spacing:.06em!important}`},
 warm:{note:'Manrope headings + Georgia body. More like reading a personal essay: textured paragraphs, quieter headings, and generous line spacing.',css:`--lab-heading:'Studio Manrope',sans-serif;--lab-body:Georgia,serif;--lab-title-weight:600;--lab-title-spacing:-.035em;--lab-heading-size:28px;--lab-body-size:18px;--lab-leading:1.8; .intro p:first-child{font-style:italic;font-size:23px!important;line-height:1.6!important}.case-sections p,.detail-body p{font-family:Georgia,serif!important}`},
 modern:{note:'Manrope throughout, with stronger weight and size contrast. My second pick: crisp, expressive headings without adding a serif or condensed face.',css:`--lab-heading:'Studio Manrope',sans-serif;--lab-body:'Studio Manrope',sans-serif;--lab-title-weight:800;--lab-title-spacing:-.05em;--lab-heading-size:32px;--lab-body-size:16px;--lab-leading:1.85; .intro p:first-child{font-size:25px!important;font-weight:600;letter-spacing:-.035em;line-height:1.55!important}`}
};
const faces=`@font-face{font-family:'Studio Manrope';src:url('/test/fonts/manrope-regular.ttf')}@font-face{font-family:'Studio Manrope';src:url('/test/fonts/manrope-semibold.ttf');font-weight:600}@font-face{font-family:'Studio Manrope';src:url('/test/fonts/manrope-extrabold.ttf');font-weight:800}@font-face{font-family:'Studio Bodoni';src:url('/test/fonts/bodoni-moda-regular.ttf')}@font-face{font-family:'Studio Bodoni';src:url('/test/fonts/bodoni-moda-italic.ttf');font-style:italic}@font-face{font-family:'Studio Barlow';src:url('/test/fonts/barlow-condensed-semibold.ttf');font-weight:600}`;
function apply(){const doc=frame.contentDocument;if(!doc?.querySelector('.intro'))return;let style=doc.getElementById('studio-type');if(!style){style=doc.createElement('style');style.id='studio-type';doc.head.append(style)}const variant=looks[look];const split=variant.css.indexOf(' .');const vars=split<0?variant.css:variant.css.slice(0,split);const extras=split<0?'':variant.css.slice(split);style.textContent=look==='original'?'':faces+`:root{${vars}}body,.intro,.case-sections,.detail-body{font-family:var(--lab-body)!important}main h2,.detail-modal h2,.contact-dialog h2,.video-link strong,.project-title h3,.archive-item h3,.role h3{font-family:var(--lab-heading)!important;font-weight:var(--lab-title-weight)!important;letter-spacing:var(--lab-title-spacing)!important;text-transform:none!important;line-height:1.2!important}main h2,.detail-modal h2,.contact-dialog h2{font-size:var(--lab-heading-size)!important}.video-link strong,.project-title h3,.archive-item h3,.role h3{font-size:26px!important}.intro p{font-size:var(--lab-body-size)!important;line-height:var(--lab-leading)!important;margin-bottom:24px!important}.intro a{text-decoration-thickness:1px;text-underline-offset:5px}.contact-options strong{font-family:var(--lab-heading)!important;font-size:23px!important;font-weight:var(--lab-title-weight)!important}.contact-options small,.hero-contacts,.navigation,.hero-status,.study-cta,button{font-family:'Studio Manrope',sans-serif!important}.detail-modal p,.detail-modal li{font-size:var(--lab-body-size)!important;line-height:var(--lab-leading)!important}`+extras+`@media(max-width:520px){main h2,.detail-modal h2{font-size:28px!important}.intro p:first-child{font-size:23px!important}.intro p{font-size:16px!important}.contact-options strong{font-size:21px!important}}`;doc.documentElement.dataset.theme=document.querySelector('#theme').value;document.querySelector('#note').textContent=variant.note;document.querySelectorAll('[data-look]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.look===look)));}
function jump(){const doc=frame.contentDocument;doc.querySelectorAll('dialog[open]').forEach(d=>d.close());const section=document.querySelector('#section').value;if(section==='modal'){doc.querySelector('#project-0').dispatchEvent(new Event('open-detail'));return}const target={top:'.identity',experience:'.experience',video:'.video-work',contact:'#work-with-me'}[section];doc.querySelector(target)?.scrollIntoView({block:'start'});}
frame.addEventListener('load',()=>{apply();jump()});document.querySelectorAll('[data-look]').forEach(b=>b.onclick=()=>{look=b.dataset.look;apply()});document.querySelector('#theme').onchange=apply;document.querySelector('#section').onchange=jump;document.querySelector('#width').onchange=e=>frame.classList.toggle('phone',e.target.value==='phone');
</script></html>
