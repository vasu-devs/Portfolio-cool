<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Small-text font sampler</title>
<link rel="stylesheet" href="/test/fontshare.css?v=125">
<style>
@font-face{font-family:Lato;src:url('./fonts/lato-regular.ttf')}
@font-face{font-family:Manrope;src:url('./fonts/manrope-regular.ttf')}
@font-face{font-family:Plex;src:url('./fonts/ibm-plex-sans.ttf');font-weight:100 700}
@font-face{font-family:Rajdhani;src:url('./fonts/rajdhani-medium.ttf')}
@font-face{font-family:Noto;src:url('./fonts/noto-serif.ttf');font-weight:100 900}
@font-face{font-family:Kalam;src:url('./fonts/kalam-regular.ttf')}
@font-face{font-family:Barlow;src:url('./fonts/barlow-condensed-semibold.ttf')}
@font-face{font-family:Bleach;src:url('./fonts/bleach-display.ttf')}
*{box-sizing:border-box}body{--bg:#e3f0f9;--ink:#172d45;--line:#b4c8d6;--surface:#edf5fb;margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui}body.dark{--bg:#061924;--ink:#e3edf4;--line:#405665;--surface:#0c2432}header{padding:24px max(20px,calc((100vw - 1160px)/2));border-bottom:1px solid var(--line)}h1{font-size:23px;margin:0 0 8px}header p{margin:0 0 18px;max-width:70ch}.controls{display:flex;gap:16px;align-items:center;flex-wrap:wrap}label{display:flex;gap:8px;align-items:center}button,select{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:8px 12px;cursor:pointer}main{max-width:1200px;margin:auto;padding:24px 20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}article{padding:24px;border:1px solid var(--line);border-radius:8px;min-width:0}article h2{font:500 13px/1.4 system-ui;margin:0 0 24px;color:var(--ink)}.heading{font:28px/1.4 Bleach,sans-serif;display:block;margin-bottom:20px}.sample{font-family:var(--font);font-size:var(--size,18px);line-height:var(--leading,1.75);font-weight:400}.sample p{margin:0 0 18px}.sample a{color:inherit;text-underline-offset:4px}.meta{font-family:var(--font);font-size:14px;line-height:1.6}.pick{margin-top:24px;font-size:13px}.pick[aria-pressed=true]{background:var(--ink);color:var(--bg)}article.chosen{outline:2px solid var(--ink);outline-offset:2px}#selection{margin-top:14px;min-height:23px}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:3px}@media(max-width:700px){main{grid-template-columns:1fr}article{padding:20px}}
</style>
<header><h1>Find the small text you like</h1><p>Same words, same Bleach heading, different supporting fonts. Mark any you like and tell me their names or numbers. This page does not change your portfolio.</p><div class="controls"><button id="theme" aria-pressed="false">Dark background</button><label>Text size <input id="size" type="range" min="16" max="23" value="18"><output id="size-label">18px</output></label><label>Spacing <select id="spacing"><option value="1.55">Compact</option><option value="1.75" selected>Relaxed</option><option value="1.95">Airy</option></select></label></div><div id="selection" aria-live="polite">No favorites marked.</div></header><main></main>
<script>
const fonts=[['Lato','Lato'],['Satoshi','Satoshi'],['Manrope','Manrope'],['IBM Plex Sans','Plex'],['Georgia','Georgia'],['Noto Serif','Noto'],['Clash Display','Clash Display'],['Kalam','Kalam'],['Rajdhani','Rajdhani'],['Barlow Condensed','Barlow']];const picked=new Set();
fonts.forEach(([name,family],i)=>{const card=document.createElement('article');card.style.setProperty('--font',`"${family}", sans-serif`);card.innerHTML=`<h2>${String(i+1).padStart(2,'0')} / ${name}</h2><span class="heading">ABOUT ME</span><div class="sample"><p>Hey, I’m Vasu. I build voice tools and full-stack apps with AI.</p><p>Sometimes it’s for work. Sometimes I just have an idea and want to see if I can build it.</p><p>I’m based in India, currently interning at withlayer.ai. I also take on freelance work.</p></div><div class="meta">AI Engineering Intern · Jun 2026 — Present<br>Open to work · Email me · Book a call</div><button class="pick" aria-pressed="false">Mark ${name}</button>`;card.querySelector('button').onclick=e=>{if(picked.has(name))picked.delete(name);else picked.add(name);e.target.setAttribute('aria-pressed',String(picked.has(name)));card.classList.toggle('chosen',picked.has(name));document.querySelector('#selection').textContent=picked.size?'Your picks: '+[...picked].join(', '):'No favorites marked.'};document.querySelector('main').append(card)});
document.querySelector('#theme').onclick=e=>{const dark=document.body.classList.toggle('dark');e.target.setAttribute('aria-pressed',String(dark));e.target.textContent=dark?'Light background':'Dark background'};document.querySelector('#size').oninput=e=>{document.body.style.setProperty('--size',e.target.value+'px');document.querySelector('#size-label').textContent=e.target.value+'px'};document.querySelector('#spacing').onchange=e=>document.body.style.setProperty('--leading',e.target.value);
</script></html>
