<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project typography comparison</title><style>body{margin:0;background:#061924;color:#e5eff5;font:15px/1.5 system-ui}header{padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}strong{margin-right:12px}button{font:inherit;background:transparent;border:1px solid #536b79;border-radius:6px;color:inherit;padding:7px 12px;cursor:pointer}button[aria-pressed=true]{background:#d7eaf1;color:#061924}iframe{display:block;width:100%;height:calc(100dvh - 125px);border:0}p{margin:0 20px 14px;color:#b2c4ce}</style><header><strong>Project type study</strong><button data-type="humanist">Humanist</button><button data-type="condensed" aria-pressed="true">Condensed</button><button data-type="editorial">Editorial</button></header><p id="note">Barlow Condensed headings + Segoe UI body. Compact and closer to the site's illustrated character.</p><iframe title="Actual project modal preview" src="/test/?type-preview=condensed#home"></iframe><script>const notes={humanist:'Segoe UI headings and body. The quietest, most neutral option.',condensed:"Barlow Condensed headings + Segoe UI body. Compact and closer to the site's illustrated character.",editorial:'Bodoni Moda headings + Segoe UI body. More like a magazine feature.'};document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));document.querySelector('iframe').src='/test/?type-preview='+b.dataset.type+'#home';document.querySelector('#note').textContent=notes[b.dataset.type]});</script></html>
