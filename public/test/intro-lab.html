<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Intro comparison · Vasu-Devs</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#061924;color:#e3f0f9;font:15px/1.5 system-ui}header{padding:16px 22px;border-bottom:1px solid #334956}h1{font-size:18px;margin:0 0 12px}nav,.settings{display:flex;flex-wrap:wrap;gap:8px;align-items:center}button,select{font:inherit;padding:7px 12px;border:1px solid #657d8b;border-radius:6px;background:#0c2532;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#e3f0f9;color:#061924}#note{margin:12px 0;color:#b7ccd9;max-width:80ch}.settings{font-size:13px;gap:16px}.stage{display:flex;justify-content:center;padding:12px}iframe{background:#e3f0f9;width:100%;height:calc(100dvh - 240px);min-height:500px;border:0;border-radius:8px}iframe.phone{max-width:390px}a{color:#b6deef}
</style>
<header><h1>Try a different introduction</h1><nav aria-label="Intro versions"><button data-version="current" aria-pressed="true">Current</button><button data-version="direct" aria-pressed="false">1 · Short & direct</button><button data-version="personal" aria-pressed="false">2 · More personal</button><button data-version="projects" aria-pressed="false">3 · Projects first</button></nav><p id="note" aria-live="polite">The current introduction, for comparison.</p><div class="settings"><label>Theme <select id="theme"><option value="light">Seireitei</option><option value="dark">Hueco Mundo</option></select></label><label>View <select id="size"><option value="desktop">Desktop</option><option value="phone">Mobile</option></select></label><span>Preview only · main page unchanged</span></div></header>
<div class="stage"><iframe title="Portfolio introduction preview" src="/test/?intro-lab=118#home"></iframe></div>
<script>
const frame=document.querySelector('iframe');let selected='current',original='';
const layer='<a href="https://withlayer.ai" target="_blank" rel="noopener noreferrer">withlayer.ai</a>';
const versions={
 current:{note:'The current introduction, for comparison.'},
 direct:{note:'My pick: a shorter introduction, with the work context underneath. Leaves the project details to the sections that follow.',html:`<p class="intro-lead">Hey, I’m Vasu. I build voice tools and full-stack apps with AI.</p><p>I’m based in India, currently interning at ${layer} and working on freelance projects. I also build my own tools and share the code and demos along the way.</p>`},
 personal:{note:'A more conversational version. Keeps the first-person voice and explains what brings the projects together.',html:`<p class="intro-lead">Hey, I’m Vasu. Most of my projects start with something I want to make easier.</p><p>That’s how I ended up building <a href="#project-0">JustHireMe</a> for job hunting and <a href="#project-1">Svara</a> for typing by voice. I work mostly with AI and full-stack apps, and make videos about what I build.</p><p>I’m based in India, interning at ${layer}, and I take on freelance work too.</p>`},
 projects:{note:'Starts with concrete examples instead of a general introduction. A larger opening line gives the top a clearer hierarchy.',html:`<p class="intro-lead">Voice tools, a job-search workbench, and a place to work on ideas.</p><p>I’m Vasu, an AI and full-stack engineer. Those are a few things I’ve built: <a href="#project-1">Svara</a>, <a href="#project-0">JustHireMe</a>, and <a href="#project-2">Dreamer</a>.</p><p>Currently interning at ${layer} and taking on freelance projects. Based in India.</p>`}
};
function render(){const doc=frame.contentDocument;if(!doc?.querySelector('.intro'))return;doc.querySelector('.intro').innerHTML=selected==='current'?original:versions[selected].html;doc.documentElement.dataset.introVariant=selected;doc.documentElement.dataset.theme=document.querySelector('#theme').value;document.querySelector('#note').textContent=versions[selected].note;document.querySelectorAll('[data-version]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.version===selected)));}
frame.addEventListener('load',()=>{const doc=frame.contentDocument;original=doc.querySelector('.intro').innerHTML;const style=doc.createElement('style');style.textContent=`html[data-intro-variant]:not([data-intro-variant="current"]) .intro{max-width:65ch}html[data-intro-variant]:not([data-intro-variant="current"]) .intro p{font-size:17px;line-height:1.8;margin:0 0 20px}html[data-intro-variant]:not([data-intro-variant="current"]) .intro .intro-lead{font-size:24px;line-height:1.5;letter-spacing:-.025em;color:var(--bright)}html[data-intro-variant="projects"] .intro .intro-lead{font-size:30px;line-height:1.4;font-weight:600;max-width:30ch}@media(max-width:520px){html[data-intro-variant]:not([data-intro-variant="current"]) .intro p{font-size:16px}html[data-intro-variant]:not([data-intro-variant="current"]) .intro .intro-lead{font-size:22px}}`;doc.head.append(style);render()});
document.querySelectorAll('[data-version]').forEach(b=>b.onclick=()=>{selected=b.dataset.version;render()});document.querySelector('#theme').onchange=render;document.querySelector('#size').onchange=e=>frame.classList.toggle('phone',e.target.value==='phone');
</script></html>
